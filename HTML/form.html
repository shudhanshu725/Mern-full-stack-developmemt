<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form in html
    </title>
</head>
<body>
    <form action="submit.php" method="post" enctype="multipart/form-data">
    <fieldset> 
        <legend>Personal Information</legend>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" [A-Za-z]+ required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="message">Message:</label>
        <textarea placeholder="Enter your message here..." id="message" name="message" rows="4" required></textarea><br><br>

        <div>
            <label for="gender">Gender:</label>
            <input type="radio" id="male" name="gender" value="male" required>
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female" required>
            <label for="female">Female</label>
        </div>
        <div>
            <label for="options">Year of passing:</label>
            <select title="Options" name="options" id="options">
                <option value="" selected disabled>Select an option</option>
                <option value="option1">2024</option>
                <option value="option2">2025</option>
                <option value="option3">2026</option>
            </select>
        </div>
        <div>
            <label for="file">Upload a file:</label>
            <input type="file" id="file" name="file" required>
        </div>
        <div>
            <label for="checkbox">I agree to the terms and conditions:</label>
            <input type="checkbox" id="checkbox" name="checkbox" required>
        </div>
        <progress value="70" max="100"></progress>
        <meter value="7" min="0" max="10"></meter>
        <br>
        <time datetime="2026-09-14">14 september 2026</time>
        <label for="text" title="Rahul">name</label>
        <input type="text" id="text" value="Rahul" readonly>

        <!-- <input type="text" value="Rahul" disabled> -->
        <input type="submit" value="Submit">
    </fieldset>   
    </form>
</body>
</html>
