<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Id and Class</title>
    <style>
        .grouped {
            background-color: lightblue;
            padding: 10px;
            margin: 5px;
        }
    </style>
    
</head>
<body>
    <!-- An ID is a unique identifier for an HTML element. It can be used to style the element with CSS or to manipulate it with JavaScript. An ID should be unique within a page, meaning that no two elements should have the same ID. -->
    <div id="unique-element" style="background-color: yellow; width: 100%; height: 100px;">This div has a unique ID.</div>
    <!-- A class is a way to group multiple HTML elements together. It can be used to apply the same styles to multiple elements or to select them with JavaScript. Unlike IDs, multiple elements can share the same class name. -->
    <div class="grouped">This div has a class name.</div>
    <div class="grouped together">This is another div with the same class name.</div>
</body>
</html>
