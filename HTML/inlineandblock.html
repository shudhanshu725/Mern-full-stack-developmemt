<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline and block element</title>
</head>
<body>
    <!-- Inline elements are those that do not start on a new line and only take up as much width as necessary. Examples of inline elements include <span>, <a>, and <strong>. -->
    <span style="background-color: red;">This is an inline element.</span>
    <!-- Block elements, on the other hand, start on a new line and take up the full width available. Examples of block elements include <div>, <p>, and <h1>. -->
    <div style="background-color: blue; width: 100%; height: 100px;">This is a block element.</div>
    <span style="background-color: green;">This is another inline element.</span>
</body>
</html>
