<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Table</title>
  <style>
    tr{
      height: 20px;
    }
  </style>
</head>

<body>
  <table border="1" style="border-collapse: collapse; width: 100%">
    <!-- Row 1 -->
    <tr>
      <td>1</td>
      <td rowspan="2">2</td>
      <td>3</td>
      <td colspan="2">4</td>
    </tr>

    <!-- Row 2 -->
    <tr>
      <td>5</td>
      <td rowspan="2" colspan="2">6</td>
      <td>7</td>
    </tr>

    <!-- Row 3 -->
    <tr>
      <td rowspan="2">8</td>
      <td rowspan="4">9</td>
      <td rowspan="2">10</td>
    </tr>

    <!-- Row 4 -->
    <tr>
      <td rowspan="2">11</td>
      <td rowspan="2">12</td>
    </tr>

    <!-- Row 5 -->
    <tr>
      <td>13</td>
      <td>14</td>
    </tr>

    <!-- Row 6 -->
    <tr>
      <td>15</td>
      <td>16</td>
      <td>17</td>
      <td>18</td>
    </tr>

    <!-- Row 7 -->
    <tr>
      <td colspan="2">19</td>
      <td>20</td>
      <td>21</td>
      <td>22</td>
    </tr>

    <!-- Row 8 -->
    <tr>
      <td rowspan="2">23</td>
      <td>24</td>
      <td>25</td>
      <td>26</td>
      <td>27</td>
    </tr>

    <!-- Row 9 -->
    <tr>
      <td>28</td>
      <td>29</td>
      <td>30</td>
      <td>31</td>
    </tr>
  </table>
</body>

</html>
